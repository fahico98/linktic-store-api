spring:
  application:
    name: linktic-store
  jackson:
    property-naming-strategy: SNAKE_CASE
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://database:5432/postgres
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # "validate" verifica que el schema coincida con las entidades pero no lo modifica.
      # Flyway es el responsable de gestionar el schema.
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true  # Marca la BD existente como base si no tiene historial Flyway
    validate-on-migrate: true  # Verifica checksums de migraciones ya aplicadas
  docker:
    compose:
      enabled: false

security:
  jwt:
    # Clave secreta en hex para firmar los tokens (HMAC-SHA256).
    # En producción, reemplazar por una variable de entorno y nunca commitear en git.
    secret-key: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 86400000  # 24 horas en milisegundos
